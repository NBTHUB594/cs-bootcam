<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container min-vh-100 py-5 d-flex justify-content-center align-items-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow" style="z-index: 10;">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3 text-center">เข้าสู่ระบบ</h1>
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="login-email" class="form-label">อีเมล</label>
                            <input type="email" class="form-control" id="login-email" required>
                        </div>
                        <div class="mb-3">
                            <label for="login-password" class="form-label">รหัสผ่าน</label>
                            <input type="password" class="form-control" id="login-password" required>
                        </div>
                        <div id="login-error" class="text-danger mb-3"></div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success">เข้าสู่ระบบ</button>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <p>ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิกที่นี่</a></p>
                        <a href="/index.html">กลับไปหน้าแรก</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
    <style>
        #catfishBanner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            background: rgba(0,0,0,0.8);
            text-align: center;
        }
        .catfishInner {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
        }
        .catfishPC {
            display: block;
            flex: 1;
        }
        #catfishClose {
            position: absolute;
            top: -30px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 2px 15px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px 5px 0 0;
            user-select: none;
        }
        body { padding-bottom: 120px; }
        
        /* ซ่อนแบนเนอร์เมื่อคีย์บอร์ดมือถือเด้งขึ้นมา (ความสูงจอลดลง) เพื่อไม่ให้ทับปุ่มล็อกอิน */
        @media (max-height: 600px) {
            #catfishBanner { display: none !important; }
            body { padding-bottom: 0; }
        }
    </style>
    <div id="catfishBanner">
        <div class="catfishInner">
            <a class="catfishPC" href="https://t.ly/789stsmovie" target="_blank" rel="nofollow noopener noreferrer">
               <img fetchpriority="high" src="https://i.imgur.com/47qxXf9.gif" alt="Banner PC" style="width:100%; max-height: 100px; object-fit: contain;">
            </a>
            <a class="catfishPC" href="https://cutt.ly/0yqJ3lH6" target="_blank" rel="nofollow noopener noreferrer">
               <img src="https://i.imgur.com/CPYpIkY.gif" alt="Banner PC" style="width:100%; max-height: 100px; object-fit: contain;">
            </a>
            <span id="catfishClose" onclick="document.getElementById('catfishBanner').style.display='none'; document.body.style.paddingBottom='0';">×</span>
        </div>
    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
