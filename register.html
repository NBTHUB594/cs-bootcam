<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h1 class="h3 mb-3 text-center">สร้างบัญชีใหม่</h1>
                    <form id="register-form">
                        <div class="mb-3">
                            <label for="register-name" class="form-label">ชื่อที่แสดง (Display Name)</label>
                            <input type="text" class="form-control" id="register-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="register-email" class="form-label">อีเมล</label>
                            <input type="email" class="form-control" id="register-email" required>
                        </div>
                        <div class="mb-3">
                            <label for="register-password" class="form-label">รหัสผ่าน</label>
                            <input type="password" class="form-control" id="register-password" required minlength="6">
                        </div>
                        <div id="register-error" class="text-danger mb-3"></div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">สมัครสมาชิก</button>
                        </div>
                    </form>
                    <div class="text-center mt-3">
                        <p>มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบที่นี่</a></p>
                         <a href="index.html">กลับไปหน้าแรก</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="register.js"></script>
</body>
</html>
