    <div class="container mt-4">

            <div class="col-lg-8">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                    <h4 class="mb-0">รายการปัญหา</h4>
                    <div class="d-flex flex-wrap gap-2">
                        <select class="form-select w-auto" id="province-filter">
                            <option value="all">ทุกจังหวัด</option>
                        </select>
                        <select class="form-select w-auto" id="district-filter">

                            <option value="top_likes">เรียงตามยอดไลก์</option>

    <div class="text-center mt-4">
         <a href="/public/dashboard.html">สำหรับเจ้าหน้าที่</a>

    <div class="modal fade" id="report-modal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="reportModalLabel">แจ้งปัญหาที่คุณพบ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="report-form">
                        <div class="mb-3">
                            <label for="problem-description" class="form-label">รายละเอียดปัญหา</label>
                            <textarea class="form-control" id="problem-description" rows="4" required placeholder="เช่น ไฟถนนดับ, ท่อระบายน้ำอุดตัน"></textarea>
                        </div>
                        <div class="mb-3">
                                <label for="problem-image" class="form-label">รูปภาพ (สูงสุด 3 รูป)</label>
                                <input type="file" class="form-control" id="problem-image" accept="image/*" multiple>
                                <small class="text-muted">เลือกได้สูงสุด 3 รูปภาพ ระบบจะบีบอัดอัตโนมัติ</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ปักหมุดจุดที่เกิดปัญหาบนแผนที่</label>
                            <div id="map" style="height: 300px; width: 100%; border-radius: 8px; border: 1px solid #ccc; z-index: 1;"></div>
                            <small class="text-muted mt-1 d-block">คุณสามารถลากหมุดบนแผนที่เพื่อระบุตำแหน่งที่ชัดเจนได้</small>
                        </div>
                        <div class="mb-3">
                            <label for="problem-location" class="form-label">สถานที่ / บริเวณที่พบปัญหา (ระบบดึงมาให้อัตโนมัติ หรือแก้ไขเพิ่มเติมได้)</label>
                            <input type="text" class="form-control" id="problem-location" required placeholder="เช่น หน้าบ้านเลขที่ 50, ซอย 1">
                            <input type="hidden" id="problem-lat" value="">
                            <input type="hidden" id="problem-lng" value="">
                            <input type="hidden" id="problem-province" value="">
                            <input type="hidden" id="problem-district" value="">
                        </div>
                        <div class="mb-3">
                            <label for="contact-info" class="form-label">ข้อมูลติดต่อ (ไม่บังคับ)</label>
                            <input type="text" class="form-control" id="contact-info" placeholder="ชื่อ หรือเบอร์โทรศัพท์สำหรับติดต่อกลับ">
                        </div>
                        <div id="anonymous-checkbox-container" style="display: none;">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="anonymous-post-checkbox">
                                <label class="form-check-label" for="anonymous-post-checkbox">
                                    โพสต์โดยไม่ระบุชื่อ
                                </label>
                            </div>
                        </div>
                        <div id="alert-message" class="mt-3"></div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">ส่งเรื่อง</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    
    <div class="modal fade" id="info-modal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">

    </div>
